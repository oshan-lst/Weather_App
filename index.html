<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Max Live Weather</title>
  <link rel="stylesheet" href="assets/style.css">
  
  

  
</head>

<!--import link cssanimate & boostrap-->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/> 
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!--main body-->
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="container my-4">
    <div class="row justify-content-center g-4">
      
      <!-- Weather Section -->
      <div class="col-lg-5 col-md-6">
        <div class="glass-card p-4 h-100 animate__animated animate__fadeInLeft">
          <h3 class="text-center fw-bold mb-3">Weather App</h3>

          <form onsubmit="handleSearch(event)">
            <div class="input-group mb-3">
              <input type="text" id="cityInput" class="form-control" placeholder="Enter city..." required>
              <button class="btn btn-warning fw-bold" type="submit">Search</button>
            </div>
          </form>

          <div id="weatherContent" class="text-center">
            <h4 id="locationName" class="fw-bold mb-0">--</h4>
            <p id="countryName" class="text-white-50 small mb-1">--</p>
            <p id="dateTime" class="text-warning small fw-semibold mb-2">--</p>
            
            <img id="weatherIcon" src="" alt="Weather" class="weather-icon my-1" style="display:none;">

            <h1 id="tempC" class="display-3 fw-bold my-1">--°C</h1>
            <p id="conditionText" class="badge bg-light text-dark fs-6 px-3 py-2 mb-3">--</p>

            <div class="row g-2 pt-3 border-top border-light-subtle text-start">
              <div class="col-6">
                <small class="text-white-50">Humidity</small>
                <h6 id="humidityVal" class="fw-bold mb-0">--</h6>
              </div>
              <div class="col-6">
                <small class="text-white-50">Wind Speed</small>
                <h6 id="windVal" class="fw-bold mb-0">--</h6>
              </div>
            </div>
          </div>

          <div id="errorAlert" class="alert alert-danger text-center mt-3 d-none p-2">
            City not found!
          </div>
        </div>
      </div>

      <!-- Map Section -->
      <div class="col-lg-7 col-md-6">
        <div class="glass-card p-4 h-100 animate__animated animate__fadeInRight">
          <h5 class="fw-bold mb-3">Location Map</h5>
          <div id="map"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
